syntax = "proto3";

package server;

import "google/protobuf/empty.proto";

option go_package = "/pb";

service ServerService {
    rpc Register(RegisterRequest) returns (RegisterResponse) {}
    rpc Login(LoginRequest) returns (LoginResponse) {}
    rpc GetBookById(BookID) returns (GetBookByIDResponse) {}
    rpc AddBook(AddBookRequest) returns (AddBookResponse) {}
    rpc UpdateBook(UpdateBookRequest) returns (UpdateBookResponse) {}
    rpc DeleteBook(BookID) returns (google.protobuf.Empty) {}
    rpc BorrowBook(BorrowBookRequest) returns (google.protobuf.Empty) {}
    rpc UpdateBookStatus(google.protobuf.Empty) returns (UpdateBookStatusResponse) {}
}

message RegisterRequest {
    string username = 1;
    string password = 2;
}

message RegisterResponse {
    string id = 1;
    string username = 2;
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    string token = 1;
}

message BookID {
    string id = 1;
}

message GetBookByIDResponse {
    string id = 1;
    string title = 2;
    string author = 3;
    string published_date = 4;
    string status = 5;
    string user_id = 6;
}

message AddBookRequest {
    string title = 1;
    string author = 2;
    string published_date = 3;
    string status = 4;
    string user_id = 5;
}

message AddBookResponse {
    string id = 1;
    string title = 2;
    string author = 3;
    string published_date = 4;
    string status = 5;
    string user_id = 6;
}

message UpdateBookRequest {
    string id = 1;
    string title = 2;
    string author = 3;
    string published_date = 4;
    string status = 5;
    string user_id = 6;
}

message UpdateBookResponse {
    string id = 1;
    string title = 2;
    string author = 3;
    string published_date = 4;
    string status = 5;
    string user_id = 6;
}

message BorrowBookRequest {
    string book_id = 1;
    string user_id = 2;
    string borrow_date = 3;
    string returned_date = 4;
}

message UpdateBookStatusResponse {
    int32 counter = 1;
}